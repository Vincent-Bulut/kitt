[project]
name = "backend"
version = "0.1.0"
description = "KITT portfolio management API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cachetools>=7.0.0",
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "numpy>=2.4.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "psycopg2-binary>=2.9.10",
    "python-multipart>=0.0.27",
    "requests>=2.32.3",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32.1",
    "yfinance>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "E501",  # long lines are handled by the formatter
    "B008",    # FastAPI dependencies (Depends/Query/File) in defaults are idiomatic
    "B905",    # zip() strictness is decided case by case
    "RUF001",  # French typography (’) in strings
    "RUF003",  # French typography (’) in comments
    "UP042",   # keep (str, Enum): str() of members is relied upon
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
