error_log /dev/stdout debug;

events { worker_connections 1024; }

http {
    server {
        listen 5700;
        server_name localhost;

        client_max_body_size 1000M;

        location / {
            proxy_pass http://webapp:80/;
        }

        location /api/ {
            proxy_pass http://api:8000/;
        }
    }
}