error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    server_tokens off;

    server {
        listen 5700;
        server_name localhost;

        # Excel referential uploads are capped at 10 MB by the API; leave room for multipart overhead
        client_max_body_size 12m;

        location / {
            proxy_pass http://webapp:80/;
        }

        # The API is only reachable through this proxy (no published port): same origin as the web app
        location /api/ {
            proxy_pass http://api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;   # correlates nginx and API logs
            proxy_read_timeout 300s;                     # some analytics (sampler, Monte Carlo) are slow
        }
    }
}
